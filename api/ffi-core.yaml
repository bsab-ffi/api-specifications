openapi: 3.0.3
info:
  title: Financial Flow Infrastructure Core API
  version: 5.0.0
  description: |
    The Financial Flow Infrastructure (FFI) Core API is a standardized interface for secure digital financial message exchange among various entities. It promotes interoperability between financial institutions, government agencies, and other stakeholders in the financial ecosystem.

    Glossary of Terms:
    
    - **FFI Message**: A structured unit of communication composed of protocol-level headers and a payload (body). Both requests and responses are considered FFI messages. The term is used to describe the full message envelope as it is transmitted within the infrastructure.
    
    Additional terms used throughout the specification are defined contextually where appropriate.
tags:
  - name: Requests
    description: Manage requests.
  - name: Responses
    description: Manage responses.
servers:
  - url: /core/v5
    description: Relative base path for the Core API
security:
  - OAuth2: []
paths:
  /requests:
    post:
      summary: Create a request.
      description: This endpoint allows users to create a new request in the Financial Flow Infrastructure Core API.
      tags:
        - Requests
      operationId: postRequest
      parameters:
        - $ref: '#/components/parameters/messageTypeHeader'
        - $ref: '#/components/parameters/messageTypeVersionHeader'
        - $ref: '#/components/parameters/traceIdHeader'
        - $ref: '#/components/parameters/clientIdHeader'
      requestBody:
        description: >
          Contains the request payload to be submitted to the Financial Flow Infrastructure Core API.
          The payload may be provided in either JSON or XML format and must conform to the schema
          associated with the declared messageTypeVersion for the specified
          messageType. The applicable schema is derived from the combination of
          messageType and messageTypeVersion.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagePayload'
          application/xml:
            schema:
              $ref: '#/components/schemas/MessagePayload'
      responses:
        '202':
          description: Accepted - API client authorized and a new request was created for processing.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
            X-FFI-RequestId:
              $ref: '#/components/headers/requestId'
            X-FFI-CreateDateTime:
              $ref: '#/components/headers/createDateTime'
        '400':
          description: Bad Request - signifies that the request is malformed, contains invalid parameters, or is otherwise schema invalid.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        '401':
          description: Unauthorized - indicates that the client request has not been completed because it lacks valid authentication credentials for the requested resource.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '403':
          description: "Forbidden: indicates that the server understands the request but refuses to authorize it in relation to the bilateral contract between the parties."
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '500':
          description: Internal Server Error - indicates that an unexpected condition was encountered preventing the server from fulfilling the request.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
  /requests/{requestId}:
    delete:
      summary: Delete (abort) a request.
      description: This endpoint allows users to delete (abort) a specific request by its identifier.
      tags:
        - Requests
      operationId: deleteRequest
      parameters:
        - $ref: '#/components/parameters/requestIdPath'
        - $ref: '#/components/parameters/traceIdHeader'
        - $ref: '#/components/parameters/clientIdHeader'
      responses:
        '204':
          description: No Content - Request deleted (aborted) successfully.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '400':
          description: Bad Request - signifies that the request is malformed, contains invalid parameters, or is otherwise schema invalid.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        '401':
          description: Unauthorized - indicates that the client request has not been completed because it lacks valid authentication credentials for the requested resource.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '403':
          description: "Forbidden: indicates that the server understands the request but refuses to authorize it."
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '404':
          description: >
            Not Found - no request is available for the referenced identifier in
            the current context. This can mean that the request does not exist,
            is no longer available, or is otherwise not available to the caller.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '405':
          description: Method Not Allowed - indicates that the message type does not allow to be aborted.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '500':
          description: Internal Server Error - indicates that an unexpected condition was encountered preventing the server from fulfilling the request.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
  /responses:
    get:
      summary: Get all available responses.
      description: This endpoint provides a list of all processed responses that are available for retrieval.
      tags:
        - Responses
      operationId: getResponseList
      parameters:
        - $ref: '#/components/parameters/traceIdHeader'
        - $ref: '#/components/parameters/clientIdHeader'
      responses:
        '200':
          description: OK - API client authorized, and request is validated.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageMetadata'
              examples:
                processingResultSuccess:
                  summary: Response metadata with successful processing
                  value:
                    - requestId: cb4c479f-6161-4ade-b51b-e78428229dad
                      responseId: 9978e48c-736a-4a81-b799-26b08a5b8426
                      createDateTime: 2024-04-30T12:34:56Z
                      messageType: TransactionInquiry
                      processingResult: SUCCESS
                      messageTypeVersion: "1"
                processingResultError:
                  summary: Response metadata with technical processing error
                  value:
                    - requestId: a31931f3-3d7c-43f4-b81a-8e2f58c42fcd
                      responseId: e171a7ce-c64f-4f3d-a7ce-47334d4647c0
                      createDateTime: 2024-04-30T12:36:10Z
                      processingResult: ERROR
        '400':
          description: Bad Request - signifies that the request is malformed, contains invalid parameters, or is otherwise schema invalid.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        '401':
          description: Unauthorized - indicates that the client request has not been completed because it lacks valid authentication credentials for the requested resource.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '403':
          description: "Forbidden: indicates that the server understands the request but refuses to authorize it."
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '429':
          description: Too Many Requests - Client has exceeded the allowed polling frequency.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
            Retry-After:
              description: The number of seconds the client must wait before making another request.
              schema:
                type: integer
        '500':
          description: Internal Server Error - indicates that an unexpected condition was encountered preventing the server from fulfilling the request.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
  /responses/{responseId}:
    get:
      summary: Get a response.
      description: This endpoint retrieves a response associated with a given response identifier. The response might be compressed for large payloads.
      tags:
        - Responses
      operationId: getResponse
      parameters:
        - $ref: '#/components/parameters/responseIdPath'
        - $ref: '#/components/parameters/traceIdHeader'
        - $ref: '#/components/parameters/clientIdHeader'
        - name: Accept-Encoding
          in: header
          description: Indicates that the client accepts gzip-encoded responses in case the payload exceeds 2kB.
          required: false
          schema:
            type: string
            enum:
              - gzip
      responses:
        '200':
          description: >
            OK - API client authorized, and request is validated. When
            X-FFI-ProcessingResult is SUCCESS, the body contains the FFI
            response payload as MessagePayload. The payload is transport-opaque
            to the Core API. Its media type is defined by the declared message
            type and version and is communicated through the Content-Type
            response header. This operation supports application/json and
            application/xml. When
            X-FFI-ProcessingResult is ERROR, the body contains an ErrorPayload
            in application/json and no business response payload is returned.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
            X-FFI-ResponseId:
              $ref: '#/components/headers/responseId'
            X-FFI-MessageType:
              $ref: '#/components/headers/messageType'
            X-FFI-MessageTypeVersion:
              $ref: '#/components/headers/messageTypeVersion'
            X-FFI-ProcessingResult:
              $ref: '#/components/headers/processingResult'
            X-FFI-CreateDateTime:
              $ref: '#/components/headers/createDateTime'
            Content-Encoding:
              description: The content encoding of the response.
              schema:
                type: string
                enum:
                  - gzip
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MessagePayload'
                  - $ref: '#/components/schemas/ErrorPayload'
            application/xml:
              schema:
                $ref: '#/components/schemas/MessagePayload'
        '400':
          description: Bad Request - signifies that the request is malformed, contains invalid parameters, or is otherwise schema invalid.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        '401':
          description: Unauthorized - indicates that the client request has not been completed because it lacks valid authentication credentials for the requested resource.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '403':
          description: "Forbidden: indicates that the server understands the request but refuses to authorize it."
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '404':
          description: >
            Not Found - no response is available for the referenced identifier in
            the current context. This can mean that the response does not exist,
            is no longer available, or is otherwise not available to the caller.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '413':
          description: Payload Too Large - indicates that the response payload exceeds the size threshold and cannot be returned because the client did not declare support for gzip compression.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '500':
          description: Internal Server Error - indicates that an unexpected condition was encountered preventing the server from fulfilling the request.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
  /responses/{responseId}/acknowledge:
    post:
      summary: Acknowledge a response.
      description: >
        This endpoint allows users to acknowledge the receipt of a response.
        When X-FFI-ProcessingResult is SUCCESS, no request body is sent. When
        X-FFI-ProcessingResult is ERROR, an ErrorPayload request body must be
        sent. OpenAPI models the request body as optional structurally, while
        the protocol requires it when the header value is ERROR.
      tags:
        - Responses
      operationId: postResponseAcknowledge
      parameters:
        - $ref: '#/components/parameters/responseIdPath'
        - $ref: '#/components/parameters/processingResultHeader'
        - $ref: '#/components/parameters/traceIdHeader'
        - $ref: '#/components/parameters/clientIdHeader'
      requestBody:
        description: >
          Optional client-side processing error report. When
          X-FFI-ProcessingResult is SUCCESS, the request body is omitted. When
          X-FFI-ProcessingResult is ERROR, an ErrorPayload request body must be
          sent. All ErrorPayload properties are optional.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorPayload'
            examples:
              processingResultSuccess:
                summary: Success acknowledge sends no request body
                description: >
                  Use X-FFI-ProcessingResult: SUCCESS and omit the request body.
              processingResultError:
                summary: Error acknowledge sends an ErrorPayload body
                value:
                  detail: The payload could not be processed because it did not conform to the agreed message structure.
      responses:
        '200':
          description: OK - API client authorized, and request is validated.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '400':
          description: Bad Request - signifies that the request is malformed, contains invalid parameters, or is otherwise schema invalid.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        '401':
          description: Unauthorized - indicates that the client request has not been completed because it lacks valid authentication credentials for the requested resource.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '403':
          description: "Forbidden: indicates that the server understands the request but refuses to authorize it."
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '404':
          description: >
            Not Found - no response is available for acknowledgment for the
            referenced identifier in the current context. This can mean that the
            response does not exist, is no longer available, or is otherwise not
            available to the caller.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
        '500':
          description: Internal Server Error - indicates that an unexpected condition was encountered preventing the server from fulfilling the request.
          headers:
            X-FFI-TraceId:
              $ref: '#/components/headers/traceId'
components:
  headers:
    traceId:
      description: The `X-FFI-TraceId` response header for the current HTTP interaction.
      required: false
      schema:
        $ref: '#/components/schemas/TraceId'
      example: 4bf92f35-77b3-4da6-a3ce-929d0e0e4736
    responseId:
      description: The identifier of the response.
      required: true
      schema:
        $ref: '#/components/schemas/MessageIdentity'
    requestId:
      description: The identifier of the request.
      required: true
      schema:
        $ref: '#/components/schemas/MessageIdentity'
    messageType:
      description: >
        The message type identifies the specification of the business data that is
        being exchanged. It describes the intended meaning and structure of the
        data, regardless of how the message is represented or wrapped during
        transport. The header is required when X-FFI-ProcessingResult is SUCCESS
        and may be omitted when X-FFI-ProcessingResult is ERROR.
      required: false
      schema:
        $ref: '#/components/schemas/MessageType'
    messageTypeVersion:
      description: >
        Identifier of the version associated with the declared message type. The
        version refers to the full set of requirements agreed within the
        bilateral contract, including schema, validation rules, and processing
        expectations. The header is required when X-FFI-ProcessingResult is
        SUCCESS and may be omitted when X-FFI-ProcessingResult is ERROR.
      required: false
      schema:
        $ref: '#/components/schemas/MessageTypeVersion'
    processingResult:
      description: >
        The processing result indicates the outcome of server-side processing.
        The value does not imply when or how validation of inner content was
        performed.
      required: true
      schema:
        $ref: '#/components/schemas/ProcessingResult'
    createDateTime:
      description: The timestamp indicating when the FFI message was created.
      required: true
      schema:
        $ref: '#/components/schemas/MessageTimestamp'
  parameters:
    responseIdPath:
      name: responseId
      description: The identifier of the FFI message.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MessageIdentity'
      example: 9978e48c-736a-4a81-b799-26b08a5b8426
    requestIdPath:
      name: requestId
      description: The identifier of the original request.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MessageIdentity'
      example: cb4c479f-6161-4ade-b51b-e78428229dad
    messageTypeHeader:
      name: X-FFI-MessageType
      description: >
        Declares the message type of the FFI message. The value identifies the
        specification associated with the payload, independent of whether the
        transported body is wrapped, transformed, or directly schema-validatable.
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/MessageType'
      example: TransactionInquiry
    messageTypeVersionHeader:
      name: X-FFI-MessageTypeVersion
      description: >
        Declares the version of the message type associated with the payload.
        The version identifies the full contractual requirement set for the
        message type, including schema, interpretation, validation, and
        processing expectations.
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/MessageTypeVersion'
      example: "1"
    processingResultHeader:
      name: X-FFI-ProcessingResult
      description: >
        Declares the client-side processing outcome for the acknowledged
        response. When the value is SUCCESS, no error report body is sent. When
        the value is ERROR, an ErrorPayload request body must be sent.
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ProcessingResult'
      examples:
        success:
          summary: The client processed the response successfully
          value: SUCCESS
        error:
          summary: The client encountered a processing error and sends an ErrorPayload body
          value: ERROR
    traceIdHeader:
      name: X-FFI-TraceId
      description: The `X-FFI-TraceId` request header for the current HTTP interaction.
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/TraceId'
      example: 4bf92f35-77b3-4da6-a3ce-929d0e0e4736
    clientIdHeader:
      name: X-FFI-ClientId
      description: The OAuth Client identifier. See ClientId schema for definition.
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ClientId'
  schemas:
    MessagePayload:
      type: string
      description: >
        Serialized body of the FFI message. The payload is opaque to the Core
        API transport contract. Its media type is defined by the declared message
        type and version and is communicated through the Content-Type response
        header. The Core API supports application/json and application/xml for
        MessagePayload.
    MessageMetadata:
      type: array
      description: The collection of metadata associated with the FFI message, including identifiers, timestamps, and processing result.
      items:
        allOf:
          - $ref: '#/components/schemas/MetadataStruct'
        example:
          requestId: cb4c479f-6161-4ade-b51b-e78428229dad
          responseId: 9978e48c-736a-4a81-b799-26b08a5b8426
          createDateTime: 2024-04-30T12:34:56Z
          messageType: TransactionInquiry
          messageTypeVersion: "1"
          processingResult: SUCCESS
    MetadataStruct:
      type: object
      description: The base object for storing FFI message metadata attributes.
      properties:
        requestId:
          $ref: '#/components/schemas/MessageIdentity'
        responseId:
          $ref: '#/components/schemas/MessageIdentity'
        messageType:
          $ref: '#/components/schemas/MessageType'
        messageTypeVersion:
          $ref: '#/components/schemas/MessageTypeVersion'
        processingResult:
          $ref: '#/components/schemas/ProcessingResult'
        createDateTime:
          $ref: '#/components/schemas/MessageTimestamp'
    MessageIdentity:
      type: string
      format: uuid
      description: The identifier of the FFI message. Must be globally unique and compliant with RFC4122.
    MessageType:
      type: string
      description: The message type corresponding to the specification and schema used to create and validate the content of a FFI message. A messageType value is a designated grouping of FFI message types that adhere to the Pascal case naming convention.
    MessageTypeVersion:
      type: string
      pattern: ^[1-9]\d*$
      description: The identifier of the message type version utilized for crafting and validating the content of the FFI message.
    TraceId:
      type: string
      format: uuid
      description: >
        Identifier assigned to a single HTTP request for technical observability.
        When returned in the corresponding HTTP response, the same value enables
        client-side and server-side log entries for that HTTP interaction to be
        matched. It does not identify or correlate an FFI request, response, or
        message exchange and MUST NOT be used for business correlation,
        authorization, message identity, idempotency, or contractual validation.
    ClientId:
      type: string
      description: The OAuth client_id issued during OAuth client registration and token issuance, representing the FFI client identity as registered with the server’s authorization server. This value is provided as supplementary request metadata and must not be used for authentication or authorization; client identity and access decisions are determined exclusively by established authentication mechanisms and validated credentials.
    ProcessingResult:
      description: The result indicating the outcome of processing the request.
      type: string
      enum:
        - SUCCESS
        - ERROR
    MessageTimestamp:
      type: string
      format: date-time
      description: >
          The timestamp representing when the FFI message was created. Must follow RFC 3339, a strict subset of ISO 8601.
          The format must be 'YYYY-MM-DDTHH:mm:ssZ' or 'YYYY-MM-DDTHH:mm:ss.SSSZ', where 'Z' indicates UTC time.
          Fractional seconds (milliseconds) are optional but, if included, must have up to three decimal places.
    ErrorPayload:
      type: object
      additionalProperties: false
      description: >
        Simplified FFI error structure for synchronous transport errors and
        asynchronous technical processing errors. All properties are optional,
        and an empty object is a valid ErrorPayload. This Core API version does
        not define a shared catalog of error types.
      properties:
        type:
          type: string
          format: uri-reference
          description: >
            Optional identifier of the error type. No FFI-defined values or
            shared machine-readable meaning are specified by this API version.
        detail:
          type: string
          description: Optional client-facing explanation specific to this error occurrence.
          example: The declared message type is not supported in this API interaction.
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        OAuth 2.0 Client Credentials flow.
        Each implementation must replace the `tokenUrl` with the actual endpoint of their authorization server.
      flows:
        clientCredentials:
          tokenUrl: https://{issuerDomain}/auth/token
          scopes: {}
